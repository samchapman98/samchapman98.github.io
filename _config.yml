# Site settings. Change these lines to change what appears on the site.
title: Sam Chapman
description: Rough notes on suffering, the long-term future, and how little we can know about either.
author: Sam Chapman

# The site's address. When you get your own domain, change this line.
url: "https://samchapman98.github.io"
baseurl: ""

# Set to true to ask Google and other search engines not to list the site.
hide_from_search_engines: false

timezone: Europe/London
permalink: /:year/:title/

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      status: sketch
  - scope:
      path: "about"
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
