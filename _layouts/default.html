<!doctype html>
<html lang="en-GB">
<head>
{% include head.html %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav class="site-nav" aria-label="Site">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Writing</a>
    <a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} aria-current="page"{% endif %}>Topics</a>
    <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
  </nav>
</header>
<main id="main">
{{ content }}
</main>
<footer class="site-footer">
  <p>Written by {{ site.author }}. Most of it is unfinished. <a href="{{ '/feed.xml' | relative_url }}">RSS feed</a></p>
</footer>
</body>
</html>
